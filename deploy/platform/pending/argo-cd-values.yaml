  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
redis:
  image:
    repository: dhi.io/redis
    tag: 8.6.6@sha256:5e18c5b4d11d55c8788a1bf360cb34fc6a40f9db215812c7ee84e82a778c71f6
  automountServiceAccountToken: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
redisSecretInit:
  enabled: false
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
