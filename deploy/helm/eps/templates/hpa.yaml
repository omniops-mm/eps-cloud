{{- if .Values.hpa.enabled }}
{{- if and (gt (float64 .Values.hpa.requestsPerSecond) 0.0) (not .Values.monitoring.enabled) }}
{{- fail "Request scaling requires monitoring.enabled" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  {{- if .Values.argocd }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.hpa.scaleDownSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Percent of the cpu request, not the limit.
          averageUtilization: {{ .Values.hpa.targetCPUPercent }}
    {{- if gt (float64 .Values.hpa.requestsPerSecond) 0.0 }}
    - type: Pods
      pods:
        metric:
          name: eps_http_requests_per_second
        target:
          type: AverageValue
          averageValue: {{ .Values.hpa.requestsPerSecond | quote }}
    {{- end }}
{{- end }}
