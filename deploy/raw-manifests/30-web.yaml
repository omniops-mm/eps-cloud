apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: eps
spec:
  selector:
    app: web
  ports:
    # Named so the Ingress can reference the port without repeating the number.
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: eps
spec:
  # The HPA takes over the replica count when it is applied.
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        # uid 1000 is the eps user from Dockerfile.web. runAsNonRoot makes the
        # kubelet refuse the pod if the image ever regresses to root.
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        # ponytail: migrations run here, so with 2 replicas both new pods run
        # them on rollout. Postgres DDL is transactional and the second run
        # no-ops. Upgrade path is a dedicated migration Job; revisit at v0.4.
        - name: migrate
          image: ghcr.io/omniops-mm/eps-cloud/web:9230464b35605b1c1e695787d7a671493522372b
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: eps
      containers:
        - name: web
          image: ghcr.io/omniops-mm/eps-cloud/web:9230464b35605b1c1e695787d7a671493522372b
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: eps
          env:
            - name: TZ
              value: Europe/Berlin
          # Liveness only checks that the process answers; restarting web
          # because the database blipped would make the blip worse.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness checks the database. A not-ready pod stops receiving
          # traffic but is not restarted, and rejoins when the db returns.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          # Sized for gunicorn with 1 worker and 4 threads. Requests are what
          # the scheduler reserves and what the HPA percentage runs against.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
