<svg xmlns="http://www.w3.org/2000/svg" width="680" height="522" viewBox="0 0 680 522" role="img" aria-labelledby="ti de">
<title id="ti">How EPS stores time-stamped data</title><desc id="de">Ticking a habit box writes a row to habit_log, the append-only event table that is the source of truth. The app then calls recompute_streak, which walks those events and rebuilds streak_state, the cache the dashboard reads. Nothing writes to the cache directly, so editing a day from three weeks ago takes the exact same path as today.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;font-weight:400}
.b{fill:none;stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="190" y="40" width="300" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text class="t" x="340.0" y="64.0" text-anchor="middle" fill="#444441">You tick a habit box</text><line x1="340" y1="98" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="140" width="300" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text class="t" x="340.0" y="158.0" text-anchor="middle" fill="#085041">habit_log</text><text class="s" x="340.0" y="178.0" text-anchor="middle" fill="#0F6E56">every event ever, append only</text><line x1="340" y1="206" x2="340" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text class="s" x="500" y="222" text-anchor="start" fill="#5F5E5A">the truth</text><rect x="190" y="248" width="300" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text class="t" x="340.0" y="266.0" text-anchor="middle" fill="#3C3489">recompute_streak()</text><text class="s" x="340.0" y="286.0" text-anchor="middle" fill="#534AB7">walks the events, rebuilds the count</text><line x1="340" y1="314" x2="340" y2="346" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="356" width="300" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text class="t" x="340.0" y="374.0" text-anchor="middle" fill="#712B13">streak_state</text><text class="s" x="340.0" y="394.0" text-anchor="middle" fill="#993C1D">what the dashboard reads</text><text class="s" x="500" y="384" text-anchor="start" fill="#5F5E5A">a cache</text><rect x="60" y="442" width="560" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text class="s" x="340" y="460" text-anchor="middle" fill="#444441">Nothing ever writes to the cache directly.</text><text class="s" x="340" y="478" text-anchor="middle" fill="#5F5E5A">Editing a day from three weeks ago takes this exact same path.</text></svg>