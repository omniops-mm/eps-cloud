<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 0 680 478" role="img" aria-labelledby="ti de">
<title id="ti">The four containers EPS runs as</title><desc id="de">A browser connects over port 80 to nginx, the only container published outside the private network. nginx serves static files itself and proxies everything else to the web container on port 8000, which runs Flask under gunicorn. A separate worker container runs the scheduled jobs and takes no inbound traffic. Both web and worker connect to Postgres, which keeps its data in a named volume.</desc>
