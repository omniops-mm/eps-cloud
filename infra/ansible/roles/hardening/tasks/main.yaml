---
- name: Install host utilities and current Debian security updates.
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
    state: present
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Disable password login while preserving OS Login integration.
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-eps.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowAgentForwarding no
      AllowTcpForwarding local
      GatewayPorts no
      X11Forwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH.

- name: Restrict the root home directory.
  ansible.builtin.file:
    path: /root
    state: directory
    owner: root
    group: root
    mode: "0700"
