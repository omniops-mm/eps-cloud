# Inbound rules for the namespace: the ingress controller is the only way in,
# the db accepts connections from the app pods only, job pods accept none.
#
# NetworkPolicies are allowlists. Once any policy selects a pod for a
# direction, everything not explicitly allowed in that direction is denied.
# The first policy selects every pod for ingress, the rest punch the holes.
#
# ponytail: ingress only. An egress allowlist would have to enumerate DNS and
# BrightSky for little value on a local cluster; add it when the cluster
# faces the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Postgres accepts 5432 from the web and job pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-from-app-only
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
        - podSelector:
            matchLabels:
              app: jobs
      ports:
        - protocol: TCP
          port: 5432
---
# Web accepts 8000 from the ingress controller's namespace only. The
# namespaceSelector uses the name label the control plane stamps on every
# namespace. A monitoring hole is added when monitoring moves in-cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-proxy-only
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
---
# Job pods take nothing inbound. Redundant next to default-deny, written out
# so the guarantee survives if the default-deny is ever deleted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobs-no-inbound
spec:
  podSelector:
    matchLabels:
      app: jobs
  policyTypes:
    - Ingress
