# Only what genuinely varies between installs. Everything else is fixed in the
# templates, same as the raw manifests.

image:
  # Release snapshots set these; local examples may still use the commit tag.
  webDigest: ""
  workerDigest: ""
  registry: ghcr.io/omniops-mm/eps-cloud
  # Full commit sha, the tag CI publishes. Never latest.
  tag: 9230464b35605b1c1e695787d7a671493522372b

# The Secret is created imperatively before install; the chart references it
# and never creates it. See raw-manifests/10-secret.yaml.example.
existingSecret: eps

timezone: Europe/Berlin

web:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

db:
  image: postgres:16-alpine
  imagePullSecrets: []
  bootstrapRoles: false
  adminSecret: eps-db-admin
  exporterSecret: eps-exporter
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

jobs:
  - name: refresh-weather
    schedule: "0 6 * * *"
  - name: cleanup-audit-log
    schedule: "0 3 * * *"

ingress:
  host: eps.localtest.me
  tls: true

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUPercent: 70

# Local HTTP remains supported; production enables secure cookies later.
secureCookies: false
argocd: false
migration:
  mode: init
