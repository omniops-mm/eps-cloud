apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-configmaps
  namespace: eps
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-configmaps
  namespace: eps
subjects:
- kind: ServiceAccount
  name: grafana
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-configmaps
---
