---
- name: Configure the EPS host.
  hosts: eps
  become: true
  gather_facts: true
  vars:
    eps_host_versions: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../deploy/platform/host-versions.json') | from_json }}"
  pre_tasks:
    - name: Require a supported host and an accepted k3s release.
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - ansible_facts.architecture == 'x86_64'
          - >-
            (eps_host_versions.k3s.approved | bool) or
            ((eps_lab_exception | default(false) | bool) and
             eps_host_versions.k3s.version == eps_host_versions.k3s.lab_exception.version and
             eps_host_versions.k3s.binary_sha256 == eps_host_versions.k3s.lab_exception.binary_sha256 and
             now(utc=true, fmt='%Y-%m-%d') < eps_host_versions.k3s.lab_exception.expires_on)
        fail_msg: "Host configuration requires Debian 13 amd64 and an accepted k3s release."
  roles:
    - hardening
    - k3s
    - role: images
      when: eps_image_bundle is defined
    - role: platform
      when: eps_platform_bundle is defined
