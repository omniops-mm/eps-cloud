text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:15px;font-weight:700}
.s{font-size:13px;font-weight:500}
.h{font-size:16px;font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 1.2L9 5L0 8.8z" fill="context-stroke"/></marker></defs>
<rect x="110" y="42" width="190" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="205.0" y="66.0" text-anchor="middle" fill="#2C2C2A">Your browser</text><rect x="60" y="106" width="560" height="342" rx="10" fill="none" stroke="#8A8880" stroke-width="2" stroke-dasharray="8 6"/><text class="s" x="80" y="124" text-anchor="start" fill="#5F5E5A">private network</text><line x1="205" y1="90" x2="205" y2="138" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><text class="s" x="217" y="112" text-anchor="start" fill="#5F5E5A">80</text><rect x="110" y="148" width="190" height="58" rx="6" fill="#0F6E56"/><text class="t" x="205.0" y="166.0" text-anchor="middle" fill="#FFFFFF">nginx</text><text class="s" x="205.0" y="188.0" text-anchor="middle" fill="#C9EEDF">static files, proxy</text><line x1="205" y1="206" x2="205" y2="246" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><text class="s" x="217" y="224" text-anchor="start" fill="#5F5E5A">8000</text><rect x="110" y="256" width="190" height="58" rx="6" fill="#0F6E56"/><text class="t" x="205.0" y="274.0" text-anchor="middle" fill="#FFFFFF">web</text><text class="s" x="205.0" y="296.0" text-anchor="middle" fill="#C9EEDF">Flask + gunicorn</text><rect x="380" y="256" width="190" height="58" rx="6" fill="#0F6E56"/><text class="t" x="475.0" y="274.0" text-anchor="middle" fill="#FFFFFF">worker</text><text class="s" x="475.0" y="296.0" text-anchor="middle" fill="#C9EEDF">APScheduler jobs</text><line x1="215" y1="314" x2="300" y2="360" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><line x1="465" y1="314" x2="380" y2="360" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><rect x="245" y="368" width="190" height="58" rx="6" fill="#534AB7"/><text class="t" x="340.0" y="386.0" text-anchor="middle" fill="#FFFFFF">Postgres</text><text class="s" x="340.0" y="408.0" text-anchor="middle" fill="#DCD9F8">named volume</text></svg>