# Shared by every service that talks to the database. Defined once so the
# connection string cannot drift between them.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://eps:${POSTGRES_PASSWORD}@db:5432/eps
  SECRET_KEY: ${SECRET_KEY}
  TZ: ${TZ:-Europe/Berlin}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eps
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eps -d eps"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # loopback-only, dev convenience: lets host-side alembic reach the db
      - "127.0.0.1:5432:5432"

  # Brings the schema up to date, then exits. Everything else waits for it.
  # Deliberately its own service rather than part of the web startup: exactly one
  # process should own the schema no matter how many web replicas run.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment: *app-env
    # Waiting on migrate also waits on the database, since migrate itself does.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  pgdata:
