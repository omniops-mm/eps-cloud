---
- name: Install host utilities.
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Apply current Debian security updates.
  ansible.builtin.apt:
    upgrade: safe

- name: Disable password login while preserving OS Login integration.
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-eps.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowAgentForwarding no
      AllowTcpForwarding local
      GatewayPorts no
      X11Forwarding no
      PermitTunnel no
      PermitUserEnvironment no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH.

- name: Restrict the root home directory.
  ansible.builtin.file:
    path: /root
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the attended-session shutdown service.
  ansible.builtin.copy:
    dest: /etc/systemd/system/eps-session-stop.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Stop the EPS learning host
      [Service]
      Type=oneshot
      ExecStart=/usr/bin/systemctl poweroff

- name: Limit each boot to a four-hour learning session.
  ansible.builtin.copy:
    dest: /etc/systemd/system/eps-session-stop.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Limit EPS host runtime
      [Timer]
      OnBootSec=4h
      AccuracySec=1min
      [Install]
      WantedBy=timers.target

- name: Enable the session shutdown timer.
  ansible.builtin.systemd_service:
    name: eps-session-stop.timer
    daemon_reload: true
    enabled: true
    state: started
