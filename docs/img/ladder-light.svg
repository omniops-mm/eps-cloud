<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="ti de">
<title id="ti">The EPS version ladder</title><desc id="de">Five rungs rising left to right: v0.1 Docker Compose, v0.2 Ansible, v0.3 Kubernetes, v1.0 Terraform on AWS, and v1.x EKS. v0.1 is in progress; the rest are planned. Each rung adds one real piece of infrastructure while the application itself barely changes.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;font-weight:400}
.b{fill:none;stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="50" y="260" width="100" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text class="t" x="100.0" y="278.0" text-anchor="middle" fill="#085041">v0.1</text><text class="s" x="100.0" y="298.0" text-anchor="middle" fill="#0F6E56">Compose</text><rect x="170" y="216" width="100" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text class="t" x="220.0" y="234.0" text-anchor="middle" fill="#444441">v0.2</text><text class="s" x="220.0" y="254.0" text-anchor="middle" fill="#5F5E5A">Ansible</text><rect x="290" y="172" width="100" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text class="t" x="340.0" y="190.0" text-anchor="middle" fill="#444441">v0.3</text><text class="s" x="340.0" y="210.0" text-anchor="middle" fill="#5F5E5A">Kubernetes</text><rect x="410" y="128" width="100" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text class="t" x="460.0" y="146.0" text-anchor="middle" fill="#444441">v1.0</text><text class="s" x="460.0" y="166.0" text-anchor="middle" fill="#5F5E5A">Terraform</text><rect x="530" y="84" width="100" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text class="t" x="580.0" y="102.0" text-anchor="middle" fill="#444441">v1.x</text><text class="s" x="580.0" y="122.0" text-anchor="middle" fill="#5F5E5A">EKS</text><text class="s" x="100" y="332" text-anchor="middle" fill="#0F6E56">in progress</text><line x1="50" y1="356" x2="630" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text class="s" x="340" y="378" text-anchor="middle" fill="#5F5E5A">each rung adds one real piece of infrastructure, the app barely changes</text></svg>