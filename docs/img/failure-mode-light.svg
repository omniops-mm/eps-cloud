<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img" aria-labelledby="ti de">
<title id="ti">Why a to-do list rots and EPS does not</title><desc id="de">Two lanes side by side. With a to-do list a task is parked somewhere and you build the list every single day, so missing a day leaves a backlog that becomes its own job. With EPS the task is entered once with its dates and EPS builds the list every day without you, so missing a day leaves no backlog.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;font-weight:400}
.b{fill:none;stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="185" y="34" text-anchor="middle" fill="#2C2C2A">To-do list</text><text class="t" x="495" y="34" text-anchor="middle" fill="#2C2C2A">EPS</text><rect x="60" y="54" width="250" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text class="t" x="185.0" y="78.0" text-anchor="middle" fill="#444441">A task occurs to you</text><rect x="370" y="54" width="250" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/><text class="t" x="495.0" y="78.0" text-anchor="middle" fill="#444441">A task occurs to you</text><line x1="185" y1="112" x2="185" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="495" y1="112" x2="495" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="162" width="250" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text class="t" x="185.0" y="180.0" text-anchor="middle" fill="#712B13">Park it somewhere</text><text class="s" x="185.0" y="200.0" text-anchor="middle" fill="#993C1D">inbox, notes app, your head</text><rect x="370" y="162" width="250" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text class="t" x="495.0" y="180.0" text-anchor="middle" fill="#085041">Enter it once</text><text class="s" x="495.0" y="200.0" text-anchor="middle" fill="#0F6E56">with its dates</text><line x1="185" y1="228" x2="185" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="495" y1="228" x2="495" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="278" width="250" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text class="t" x="185.0" y="296.0" text-anchor="middle" fill="#712B13">You build the list</text><text class="s" x="185.0" y="316.0" text-anchor="middle" fill="#993C1D">every single day</text><rect x="370" y="278" width="250" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text class="t" x="495.0" y="296.0" text-anchor="middle" fill="#085041">EPS builds the list</text><text class="s" x="495.0" y="316.0" text-anchor="middle" fill="#0F6E56">every day, without you</text><line x1="185" y1="344" x2="185" y2="384" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/><line x1="495" y1="344" x2="495" y2="384" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="60" y="394" width="250" height="84" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/><text class="t" x="185" y="416" text-anchor="middle" fill="#712B13">If you miss a day</text><text class="s" x="185" y="440" text-anchor="middle" fill="#993C1D">The backlog becomes its own</text><text class="s" x="185" y="457" text-anchor="middle" fill="#993C1D">job, and it only gets harder.</text><rect x="370" y="394" width="250" height="84" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text class="t" x="495" y="416" text-anchor="middle" fill="#085041">If you miss a day</text><text class="s" x="495" y="440" text-anchor="middle" fill="#0F6E56">There is no backlog. You enter</text><text class="s" x="495" y="457" text-anchor="middle" fill="#0F6E56">tasks, not lists, so carry on.</text></svg>