<svg xmlns="http://www.w3.org/2000/svg" width="680" height="536" viewBox="0 0 680 536" role="img" aria-labelledby="ti de">
<title id="ti">How EPS stores time-stamped data</title><desc id="de">Ticking a habit box writes a row to habit_log, the append-only event table that is the source of truth. The app then calls recompute_streak, which walks those events and rebuilds streak_state, the cache the dashboard reads. Nothing writes to the cache directly, so editing a day from three weeks ago takes the exact same path as today.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:15px;font-weight:700}
.s{font-size:13px;font-weight:500}
.h{font-size:16px;font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 1.2L9 5L0 8.8z" fill="context-stroke"/></marker></defs>
<rect x="190" y="42" width="300" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="340.0" y="66.0" text-anchor="middle" fill="#2C2C2A">You tick a habit box</text><line x1="340" y1="90" x2="340" y2="132" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><rect x="190" y="142" width="300" height="58" rx="6" fill="#0F6E56"/><text class="t" x="340.0" y="160.0" text-anchor="middle" fill="#FFFFFF">habit_log</text><text class="s" x="340.0" y="182.0" text-anchor="middle" fill="#C9EEDF">every event ever, append only</text><text class="s" x="502" y="171" text-anchor="start" fill="#5F5E5A">the truth</text><line x1="340" y1="200" x2="340" y2="242" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><rect x="190" y="252" width="300" height="58" rx="6" fill="#534AB7"/><text class="t" x="340.0" y="270.0" text-anchor="middle" fill="#FFFFFF">recompute_streak()</text><text class="s" x="340.0" y="292.0" text-anchor="middle" fill="#DCD9F8">rebuilds the cache from the events</text><line x1="340" y1="310" x2="340" y2="352" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><rect x="190" y="362" width="300" height="58" rx="6" fill="#993C1D"/><text class="t" x="340.0" y="380.0" text-anchor="middle" fill="#FFFFFF">streak_state</text><text class="s" x="340.0" y="402.0" text-anchor="middle" fill="#FAD9CB">what the dashboard reads</text><text class="s" x="502" y="391" text-anchor="start" fill="#5F5E5A">a cache</text><rect x="60" y="452" width="560" height="62" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="340.0" y="472.0" text-anchor="middle" fill="#2C2C2A">Nothing ever writes to the cache directly.</text><text class="s" x="340.0" y="494.0" text-anchor="middle" fill="#5F5E5A">Editing a day from three weeks ago takes this exact same path.</text></svg>