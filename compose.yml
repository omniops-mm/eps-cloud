# Shared by every service that talks to the database. Defined once so the
# connection string cannot drift between them.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://eps:${POSTGRES_PASSWORD}@db:5432/eps
  SECRET_KEY: ${SECRET_KEY}
  TZ: ${TZ:-Europe/Berlin}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eps
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./observability/init-exporter-role.sh:/docker-entrypoint-initdb.d/init-exporter-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eps -d eps"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # loopback-only, dev convenience: lets host-side alembic reach the db
      - "127.0.0.1:5432:5432"

  # Brings the schema up to date, then exits. Everything else waits for it.
  # Deliberately its own service rather than part of the web startup: exactly one
  # process should own the schema no matter how many web replicas run.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment: *app-env
    # Waiting on migrate also waits on the database, since migrate itself does.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - web

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres_exporter:${POSTGRES_EXPORTER_PASSWORD}@db:5432/eps?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    # no healthcheck: a dead exporter is already visible as up{job="postgres"} == 0

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    volumes:
      # read-only views of the container runtime's accounting, nothing writable
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    # no healthcheck: a dead cadvisor is already visible as up{job="cadvisor"} == 0

  alertmanager:
    image: prom/alertmanager:v0.33.1
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      # loopback-only, dev convenience: silences and alert state at :9093
      - "127.0.0.1:9093:9093"

  alert-log:
    image: python:3.12-slim
    # nothing here needs root or a writable filesystem
    user: "65534:65534"
    read_only: true
    volumes:
      - ./observability/alert-log.py:/alert-log.py:ro
    command: ["python", "/alert-log.py"]

  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      # scraped history survives restarts; it cannot be rebuilt after the fact
      - prometheus-data:/prometheus
    ports:
      # loopback-only, dev convenience: the query UI at http://localhost:9090
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
  prometheus-data:
