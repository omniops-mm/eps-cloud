# Pending restricted runtime acceptance and Redis registry access. Do not install.
createClusterRoles: false
global:
  image:
    repository: ghcr.io/omniops-mm/eps-cloud/argocd
    tag: ef73771d65a6ef33cb7846c88d6c58514d54e9f4@sha256:294ac56b2bcc076902e5d6f971f9355061f4d3766111c87b81bd47d1329f1305
  imagePullSecrets:
  - name: dhi-pull
configs:
  cm:
    application.resourceTrackingMethod: annotation
    resource.respectRBAC: strict
    users.anonymous.enabled: 'false'
  rbac:
    policy.default: ''
  params:
    server.insecure: false
  clusterCredentials:
    eps:
      name: in-cluster-eps
      server: https://kubernetes.default.svc
      namespaces: eps
      clusterResources: false
      config: {}
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
repoServer:
  automountServiceAccountToken: false
  serviceAccount:
    automountServiceAccountToken: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
redis:
  # DHI uses tini; the chart supplies arguments without the executable.
  extraArgs:
  - redis-server
  image:
    repository: dhi.io/redis
    tag: 8.6.6@sha256:5e18c5b4d11d55c8788a1bf360cb34fc6a40f9db215812c7ee84e82a778c71f6
  automountServiceAccountToken: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
redisSecretInit:
  enabled: false
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
  automountServiceAccountToken: false
