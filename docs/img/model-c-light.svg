<svg xmlns="http://www.w3.org/2000/svg" width="680" height="584" viewBox="0 0 680 584" role="img" aria-labelledby="ti de">
<title id="ti">How EPS stores your data</title><desc id="de">You tick a habit box for a day you missed. The tick is stored as one row in the habit_log history table, next to every other day. The app then replays that history with recompute_streak and rebuilds the summary the dashboard shows, so the streak count corrects itself. The summary is never edited directly; fixing an old day uses the same path as ticking today.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:15px;font-weight:700}
.s{font-size:13px;font-weight:500}
.h{font-size:16px;font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 1.2L9 5L0 8.8z" fill="context-stroke"/></marker></defs>
<rect x="190" y="40" width="300" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="340.0" y="57.0" text-anchor="middle" fill="#2C2C2A">Fixing a missed day</text><text class="s" x="340.0" y="79.0" text-anchor="middle" fill="#5F5E5A">you tick July 2, three days late</text><line x1="340" y1="96" x2="340" y2="138" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><rect x="190" y="146" width="300" height="156" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><rect x="190" y="146" width="300" height="36" rx="6" fill="#0F6E56"/><rect x="190" y="176" width="300" height="6" fill="#0F6E56"/><text class="t" x="340" y="164" text-anchor="middle" fill="#FFFFFF">habit_log, the full history</text><text class="s" x="212" y="197" text-anchor="start" fill="#2C2C2A">Jul 1</text><text class="s" x="468" y="197" text-anchor="end" fill="#5F5E5A">done</text><rect x="193" y="212" width="294" height="30" fill="#E1F5EE"/><text class="s" x="212" y="227" text-anchor="start" fill="#085041">Jul 2</text><text class="s" x="468" y="227" text-anchor="end" fill="#085041">done, added just now</text><line x1="193" y1="212" x2="487" y2="212" stroke="#5F5E5A" stroke-width="1" opacity="0.3"/><text class="s" x="212" y="257" text-anchor="start" fill="#2C2C2A">Jul 3</text><text class="s" x="468" y="257" text-anchor="end" fill="#5F5E5A">done</text><line x1="193" y1="242" x2="487" y2="242" stroke="#5F5E5A" stroke-width="1" opacity="0.3"/><text class="s" x="212" y="287" text-anchor="start" fill="#2C2C2A">Jul 4</text><text class="s" x="468" y="287" text-anchor="end" fill="#5F5E5A">done</text><line x1="193" y1="272" x2="487" y2="272" stroke="#5F5E5A" stroke-width="1" opacity="0.3"/><line x1="340" y1="302" x2="340" y2="358" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><text class="s" x="354" y="318" text-anchor="start" fill="#5F5E5A">recompute_streak()</text><text class="s" x="354" y="338" text-anchor="start" fill="#5F5E5A">replays the whole history</text><rect x="190" y="366" width="300" height="84" rx="6" fill="#993C1D"/><text class="t" x="340.0" y="390" text-anchor="middle" fill="#FFFFFF">streak_state, the summary</text><text class="s" x="340.0" y="415" text-anchor="middle" fill="#FAD9CB">current streak: 4 (was 2)</text><text class="s" x="340.0" y="434" text-anchor="middle" fill="#FAD9CB">what the dashboard reads</text><rect x="60" y="486" width="560" height="62" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="340.0" y="506.0" text-anchor="middle" fill="#2C2C2A">The summary is never edited, only rebuilt.</text><text class="s" x="340.0" y="528.0" text-anchor="middle" fill="#5F5E5A">Fixing an old day is the same code path as ticking today's box.</text></svg>