<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img" aria-labelledby="ti de">
<title id="ti">What CI does on every push</title><desc id="de">Every push or pull request runs lint with ruff and mypy, then the pytest suite, then builds the four container images and scans them with Trivy, and finally publishes them to the GitHub container registry tagged by commit SHA rather than latest.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:15px;font-weight:700}
.s{font-size:13px;font-weight:500}
.h{font-size:16px;font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 1.2L9 5L0 8.8z" fill="context-stroke"/></marker></defs>
<rect x="170" y="42" width="340" height="58" rx="6" fill="#2C2C2A" stroke="#B4B2A9" stroke-width="2"/><text class="t" x="340.0" y="60.0" text-anchor="middle" fill="#F1EFE8">push</text><text class="s" x="340.0" y="82.0" text-anchor="middle" fill="#B4B2A9">on any branch, or a pull request</text><line x1="340" y1="102" x2="340" y2="128" stroke="#B4B2A9" stroke-width="2.25" marker-end="url(#a)"/><rect x="170" y="130" width="340" height="58" rx="6" fill="#0F6E56"/><text class="t" x="340.0" y="148.0" text-anchor="middle" fill="#FFFFFF">lint</text><text class="s" x="340.0" y="170.0" text-anchor="middle" fill="#C9EEDF">ruff, then mypy</text><line x1="340" y1="190" x2="340" y2="216" stroke="#B4B2A9" stroke-width="2.25" marker-end="url(#a)"/><rect x="170" y="218" width="340" height="58" rx="6" fill="#0F6E56"/><text class="t" x="340.0" y="236.0" text-anchor="middle" fill="#FFFFFF">test</text><text class="s" x="340.0" y="258.0" text-anchor="middle" fill="#C9EEDF">pytest</text><line x1="340" y1="278" x2="340" y2="304" stroke="#B4B2A9" stroke-width="2.25" marker-end="url(#a)"/><rect x="170" y="306" width="340" height="58" rx="6" fill="#0F6E56"/><text class="t" x="340.0" y="324.0" text-anchor="middle" fill="#FFFFFF">build and scan</text><text class="s" x="340.0" y="346.0" text-anchor="middle" fill="#C9EEDF">four images, then Trivy</text><line x1="340" y1="366" x2="340" y2="392" stroke="#B4B2A9" stroke-width="2.25" marker-end="url(#a)"/><rect x="170" y="394" width="340" height="58" rx="6" fill="#534AB7"/><text class="t" x="340.0" y="412.0" text-anchor="middle" fill="#FFFFFF">publish</text><text class="s" x="340.0" y="434.0" text-anchor="middle" fill="#DCD9F8">GHCR, tagged by commit SHA</text></svg>