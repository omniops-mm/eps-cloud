  - pods/log
  - events
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - services
  - configmaps
  verbs: &id001
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs: *id001
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs: *id001
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs: *id001
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs: *id001
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
