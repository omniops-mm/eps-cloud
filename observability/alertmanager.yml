# Alertmanager: receives firing alerts from Prometheus and delivers them.
# One route, one receiver: everything goes to the log container.

route:
  receiver: log
  # each alert gets its own group: without this every alert shares one group,
  # and a new alert can wait out group_interval behind an unrelated older one
  group_by: ["alertname"]
  # alerts arriving within this window are delivered as one grouped payload
  group_wait: 10s

receivers:
  - name: log
    webhook_configs:
      - url: http://alert-log:9091/
