<svg xmlns="http://www.w3.org/2000/svg" width="680" height="418" viewBox="0 0 680 418" role="img" aria-labelledby="ti de">
<title id="ti">The EPS version ladder</title><desc id="de">Five rungs rising left to right: v0.1 Docker Compose, v0.2 Ansible, v0.3 Kubernetes, v1.0 Terraform on AWS, and v1.x EKS. v0.1 is in progress; the rest are planned. Each rung adds one real piece of infrastructure while the application itself barely changes.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:15px;font-weight:700}
.s{font-size:13px;font-weight:500}
.h{font-size:16px;font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 1.2L9 5L0 8.8z" fill="context-stroke"/></marker></defs>
<rect x="44" y="270" width="114" height="62" rx="6" fill="#0F6E56"/><text class="t" x="101.0" y="290.0" text-anchor="middle" fill="#FFFFFF">v0.1</text><text class="s" x="101.0" y="312.0" text-anchor="middle" fill="#C9EEDF">Compose</text><rect x="166" y="224" width="114" height="62" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="223.0" y="244.0" text-anchor="middle" fill="#2C2C2A">v0.2</text><text class="s" x="223.0" y="266.0" text-anchor="middle" fill="#5F5E5A">Ansible</text><rect x="288" y="178" width="114" height="62" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="345.0" y="198.0" text-anchor="middle" fill="#2C2C2A">v0.3</text><text class="s" x="345.0" y="220.0" text-anchor="middle" fill="#5F5E5A">Kubernetes</text><rect x="410" y="132" width="114" height="62" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="467.0" y="152.0" text-anchor="middle" fill="#2C2C2A">v1.0</text><text class="s" x="467.0" y="174.0" text-anchor="middle" fill="#5F5E5A">Terraform</text><rect x="532" y="86" width="114" height="62" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="589.0" y="106.0" text-anchor="middle" fill="#2C2C2A">v1.x</text><text class="s" x="589.0" y="128.0" text-anchor="middle" fill="#5F5E5A">EKS</text><text class="s" x="101.0" y="352" text-anchor="middle" fill="#0F6E56">in progress</text><line x1="44" y1="376" x2="640" y2="376" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><text class="s" x="340" y="398" text-anchor="middle" fill="#5F5E5A">each rung adds one real piece of infrastructure, the app barely changes</text></svg>