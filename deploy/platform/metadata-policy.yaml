# Apply separately in each named platform namespace; never in EPS.
# Policies are additive: another allow rule can reopen link-local access.
# Apply in argocd, monitoring, keda and external-secrets. EPS has stricter policies.
# Host processes and kube-system remain trusted. Do not use hostNetwork here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-link-local-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.0.0/16]
