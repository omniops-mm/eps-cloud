    repository: dhi.io/argocd
    tag: 3.5.2@sha256:63b043cfc1184ece55d445e03a750fe8e780ea16ae411c2ee1dee2b6fe0f7a77
  imagePullSecrets:
  - name: dhi-pull
configs:
