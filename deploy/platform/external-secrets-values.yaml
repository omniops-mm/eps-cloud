# Reviewed DHI candidate; registry credentials and live rehearsal are required.
# Combine with a namespace-specific values file.
global:
  imagePullSecrets:
    - name: dhi-pull
image:
  repository: dhi.io/external-secrets
  tag: "2.10.0@sha256:11cb25e0bbcc472943039ddbb3f1dfc8a7268da402f0ba499da8a43f68cc08b8"
installCRDs: false
createOperator: false
scopedRBAC: true
replicaCount: 1
processClusterStore: false
processClusterExternalSecret: false
processPushSecret: false
processClusterPushSecret: false
resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {cpu: 250m, memory: 192Mi}
securityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
webhook:
  image:
    repository: dhi.io/external-secrets
    tag: "2.10.0@sha256:11cb25e0bbcc472943039ddbb3f1dfc8a7268da402f0ba499da8a43f68cc08b8"
  create: false
  certManager:
    enabled: true
    cert:
      issuerRef:
        group: cert-manager.io
        kind: Issuer
        name: eso-webhook
      privateKey:
        rotationPolicy: Always
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 96Mi}
certController:
  create: false
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 96Mi}

processClusterGenerator: false
rbac:
  serviceAccountTokenCreate: false
  # Grant ESO access explicitly; do not extend Kubernetes' default user roles.
  aggregateToView: false
  aggregateToEdit: false
  aggregateToAdmin: false
  servicebindings:
    create: false
