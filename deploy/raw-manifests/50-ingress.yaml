# Routing rule for the cluster's ingress controller. This replaces the compose
# nginx tier; the controller is the reverse proxy, installed once per cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: eps
spec:
  ingressClassName: nginx
  rules:
    # localtest.me and its subdomains resolve to 127.0.0.1 in public DNS.
    # Offline fallback is one hosts-file line.
    - host: eps.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
