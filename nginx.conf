# EPS reverse proxy. Replaces /etc/nginx/nginx.conf wholesale, so this
# is the entire config, not a snippet. TLS -> v0.2

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/json application/javascript image/svg+xml text/plain;

    # compose DNS resolves "web" to the web container
    upstream eps_web {
        server web:8000;
    }

    server {
        listen 80;

        # single-user app, 1m covers every form in the UI
        client_max_body_size 1m;

        location / {
            proxy_pass http://eps_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # fail fast if web is down, be patient with slow responses
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}