<svg xmlns="http://www.w3.org/2000/svg" width="680" height="512" viewBox="0 0 680 512" role="img" aria-labelledby="ti de">
<title id="ti">Why a to-do list rots and EPS does not</title><desc id="de">Two lanes side by side. With a to-do list a task is parked somewhere and you build the list every single day, so missing a day leaves a backlog that becomes its own job. With EPS the task is entered once with its dates and EPS builds the list every day without you, so missing a day leaves no backlog.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:15px;font-weight:700}
.s{font-size:13px;font-weight:500}
.h{font-size:16px;font-weight:700}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 1.2L9 5L0 8.8z" fill="context-stroke"/></marker></defs>
<text class="h" x="185" y="36" text-anchor="middle" fill="#2C2C2A">To-do list</text><text class="h" x="495" y="36" text-anchor="middle" fill="#2C2C2A">EPS</text><rect x="60" y="58" width="250" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="185.0" y="82.0" text-anchor="middle" fill="#2C2C2A">A task occurs to you</text><rect x="370" y="58" width="250" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text class="t" x="495.0" y="82.0" text-anchor="middle" fill="#2C2C2A">A task occurs to you</text><line x1="185" y1="106" x2="185" y2="148" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><line x1="495" y1="106" x2="495" y2="148" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><rect x="60" y="158" width="250" height="58" rx="6" fill="#993C1D"/><text class="t" x="185.0" y="176.0" text-anchor="middle" fill="#FFFFFF">Park it somewhere</text><text class="s" x="185.0" y="198.0" text-anchor="middle" fill="#FAD9CB">inbox, notes app, your head</text><rect x="370" y="158" width="250" height="58" rx="6" fill="#0F6E56"/><text class="t" x="495.0" y="176.0" text-anchor="middle" fill="#FFFFFF">Enter it once</text><text class="s" x="495.0" y="198.0" text-anchor="middle" fill="#C9EEDF">with its dates</text><line x1="185" y1="216" x2="185" y2="258" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><line x1="495" y1="216" x2="495" y2="258" stroke="#444441" stroke-width="2.25" marker-end="url(#a)"/><rect x="60" y="268" width="250" height="58" rx="6" fill="#993C1D"/><text class="t" x="185.0" y="286.0" text-anchor="middle" fill="#FFFFFF">You build the list</text><text class="s" x="185.0" y="308.0" text-anchor="middle" fill="#FAD9CB">every single day</text><rect x="370" y="268" width="250" height="58" rx="6" fill="#0F6E56"/><text class="t" x="495.0" y="286.0" text-anchor="middle" fill="#FFFFFF">EPS builds the list</text><text class="s" x="495.0" y="308.0" text-anchor="middle" fill="#C9EEDF">every day, without you</text><line x1="185" y1="326" x2="185" y2="368" stroke="#444441" stroke-width="2.25" marker-end="url(#a)" stroke-dasharray="7 5"/><line x1="495" y1="326" x2="495" y2="368" stroke="#444441" stroke-width="2.25" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="60" y="378" width="250" height="88" rx="6" fill="#993C1D"/><text class="t" x="185.0" y="402" text-anchor="middle" fill="#FFFFFF">If you miss a day</text><text class="s" x="185.0" y="427" text-anchor="middle" fill="#FAD9CB">The backlog becomes its own</text><text class="s" x="185.0" y="446" text-anchor="middle" fill="#FAD9CB">job, and it only gets harder.</text><rect x="370" y="378" width="250" height="88" rx="6" fill="#0F6E56"/><text class="t" x="495.0" y="402" text-anchor="middle" fill="#FFFFFF">If you miss a day</text><text class="s" x="495.0" y="427" text-anchor="middle" fill="#C9EEDF">There is no backlog. You enter</text><text class="s" x="495.0" y="446" text-anchor="middle" fill="#C9EEDF">tasks, not lists, so carry on.</text></svg>