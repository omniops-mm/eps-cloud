name: ci

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant additional permissions only at job scope.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run mypy app worker tests

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # the suite builds its own in-memory database, so no services are needed
      - run: uv run pytest -q

  migrations:
    # Validate migrations against PostgreSQL in addition to SQLite unit tests.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eps
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: eps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eps -d eps"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # an address, not a name: "localhost" can resolve to IPv6 first and the
      # service only listens on IPv4, which costs a connect timeout per command
      DATABASE_URL: postgresql+psycopg://eps:ci-only-password@127.0.0.1:5432/eps
      SECRET_KEY: ci-only-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Verify migration lock contention and release
        run: uv run pytest -q tests/test_migration_lock.py
        env:
          EPS_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
      - name: Apply every migration to an empty database
        run: uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Every migration can be undone
        # Verify the reverse migration path against PostgreSQL.
        run: uv run alembic downgrade base
      - name: Seed a fresh database
        run: |
          uv run alembic upgrade head
          uv run python seed.py

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool validates the prometheus config and alert rules
        # mounted at /etc/prometheus so the rule_files path inside the config
        # resolves exactly as it does in the running container
        run: >
          docker run --rm -v $PWD/observability:/etc/prometheus:ro
          --entrypoint promtool prom/prometheus:v3.13.2
          check config /etc/prometheus/prometheus.yml
      - name: amtool validates the alertmanager config
        run: >
          docker run --rm -v $PWD/observability:/etc/alertmanager:ro
          --entrypoint amtool prom/alertmanager:v0.33.1
          check-config /etc/alertmanager/alertmanager.yml

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Install checksum-verified CI tools
        run: uv run python scripts/install_ci_tools.py
      - name: Lint development and production charts
        run: |
          helm lint deploy/helm/eps
          helm lint deploy/helm/eps -f deploy/helm/eps/values-production.yaml
      - name: Validate raw Kubernetes resources
        run: >-
          kubeconform -strict -summary -kubernetes-version 1.36.3
          deploy/raw-manifests
      - name: Validate chart variants and security controls
        run: uv run python scripts/check_deploy.py
      - name: Validate opt-in monitoring and security regressions
        run: |
          uv run python -m scripts.check_monitoring --rules-output "$RUNNER_TEMP/eps-monitoring"
          uv run pytest -q tests/test_monitoring.py
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -v "$RUNNER_TEMP/eps-monitoring:/rules:ro" --entrypoint promtool prom/prometheus:v3.13.2 check rules /rules/alerts.yaml /rules/dashboards.yaml
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -v "$RUNNER_TEMP/eps-monitoring:/rules:ro" -v "$PWD/tests:/tests:ro" --entrypoint promtool prom/prometheus:v3.13.2 test rules /tests/monitoring-rules.yml
      - name: Validate pinned platform charts and custom resources
        run: uv run python scripts/check_platform.py

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check Ansible configuration without cloud credentials.
        working-directory: infra/ansible
        run: |
          uv run --no-project --with-requirements requirements.txt ansible-playbook --syntax-check -i 'eps-box,' site.yaml
          uv run --no-project --with-requirements requirements.txt ansible-lint --offline site.yaml

  images:
    needs: [lint, types, tests, migrations, monitoring-config, deploy-config, infrastructure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      # Report each image independently.
      fail-fast: false
      matrix:
        # Migrations reuse the web image.
        # Fork PRs do not receive registry credentials; Argo is verified on master pushes.
        image: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/master' && '["web","worker","nginx","argocd"]' || '["web","worker","nginx"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate read-only Argo donor access
        if: matrix.image == 'argocd'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      - name: Authenticate signed donor inventory access
        if: matrix.image == 'argocd'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.scout.docker.com
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      - name: Build into the runner, not the registry
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          load: true
          tags: eps-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Validate nginx configuration in the built image
        if: matrix.image == 'nginx'
        # nginx -t resolves the upstream name but does not need a running app.
        run: >-
          docker run --rm --network none --add-host web:127.0.0.1
          eps-nginx:${{ github.sha }} nginx -t

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: eps-${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          # reports everything and never fails; the gate below is what blocks
          exit-code: "0"

      - name: Send findings to the Security tab
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        # upload even when a later step fails, or a bad image reports nothing
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Block on high or critical problems that have a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: eps-${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          # an unfixable CVE in a base image should not block unrelated work
          ignore-unfixed: true
          exit-code: "1"

      - name: Install the verified Argo inventory tool
        if: matrix.image == 'argocd'
        run: python3 scripts/install_ci_tools.py docker-scout

      - name: Verify the Argo donor and patched runtime
        if: matrix.image == 'argocd'
        env:
          LOCAL_IMAGE: eps-argocd:${{ github.sha }}
        run: python3 -m scripts.verify_argocd_image "$LOCAL_IMAGE"

      - name: Remove temporary Docker donor credentials
        if: always() && matrix.image == 'argocd'
        run: |
          docker logout dhi.io
          docker logout registry.scout.docker.com

      - name: Scan the complete derived Argo inventory
        if: matrix.image == 'argocd'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: sbom
          scan-ref: sbom-argocd.cdx.json
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Retain Argo donor verification and integrity evidence
        if: matrix.image == 'argocd'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: argocd-integrity
          path: |
            argocd-donor-attestation.json
            argocd-integrity.json
          if-no-files-found: error
          retention-days: 30

      - name: Create image software inventory (SBOM)
        if: matrix.image != 'argocd'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: eps-${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
          exit-code: "0"

      - name: Upload image software inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned image, tagged by commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          LOCAL_IMAGE: eps-${{ matrix.image }}:${{ github.sha }}
          REMOTE_IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
        # Retag the image already loaded and scanned above; never rebuild here.
        run: |
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"

      - name: Record published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          REMOTE_IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
        run: python3 scripts/record_image_digest.py > image-${{ matrix.image }}.json

      - name: Upload image digest record
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.image }}
          path: image-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 30

  sign-images:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker, nginx, argocd]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: image-digest-${{ matrix.image }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign and verify the exact published digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
        # Keyless signing publishes release identity/digest metadata to Sigstore's public log.
        run: python3 -m scripts.sign_image
      - uses: actions/upload-artifact@v4
        with:
          name: image-verification-${{ matrix.image }}
          path: verified-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 30

  release-snapshot:
    needs: sign-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: image-digest-web
          path: release-records
      - uses: actions/download-artifact@v4
        with:
          name: image-digest-worker
          path: release-records
      - name: Prepare snapshot from this verified run
        run: uv run python -m scripts.prepare_release
      - run: uv run python scripts/install_ci_tools.py
      - name: Validate the digest-pinned snapshot
        run: |
          helm template eps release-snapshot/chart --namespace eps -f release-snapshot/chart/values-production.yaml -f release-snapshot/chart/values-gitops.yaml > release-snapshot/rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.36.3 release-snapshot/rendered.yaml
          uv run python -m scripts.check_release_snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: release-snapshot/
          if-no-files-found: error
          retention-days: 30
