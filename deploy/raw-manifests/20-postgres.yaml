# ponytail: self-managed Postgres is for the local cluster only; the database
# moves to a managed service at v1.0.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: eps
spec:
  # Headless: no virtual IP, the name resolves straight to the pod.
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: eps
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          # Same pinned image as compose.
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: eps
            - name: POSTGRES_USER
              value: eps
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eps
                  key: POSTGRES_PASSWORD
            # One level below the mount: initdb refuses a data dir that
            # already contains anything, and provisioners may drop files
            # at the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "eps", "-d", "eps"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "eps", "-d", "eps"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
